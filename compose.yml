services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: game_library
      POSTGRES_DB: game_library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_library -d game_library"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
